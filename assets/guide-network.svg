<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0b1020"/><text x="80" y="90" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Connection health</text><text x="80" y="125" fill="#8fa0b8" font-family="Arial" font-size="17">Ping, jitter and packet loss measure different problems.</text><g font-family="Arial"><rect x="80" y="200" width="300" height="230" rx="20" fill="#172239"/><text x="115" y="250" fill="#39d8ff" font-size="19" font-weight="700">PING</text><text x="115" y="305" fill="#fff" font-size="42" font-weight="700">24 ms</text><text x="115" y="350" fill="#9eacc0" font-size="16">round-trip latency</text><rect x="450" y="200" width="300" height="230" rx="20" fill="#172239"/><text x="485" y="250" fill="#39d8ff" font-size="19" font-weight="700">JITTER</text><text x="485" y="305" fill="#fff" font-size="42" font-weight="700">2 ms</text><text x="485" y="350" fill="#9eacc0" font-size="16">latency variation</text><rect x="820" y="200" width="300" height="230" rx="20" fill="#172239"/><text x="855" y="250" fill="#39d8ff" font-size="19" font-weight="700">LOSS</text><text x="855" y="305" fill="#fff" font-size="42" font-weight="700">0%</text><text x="855" y="350" fill="#9eacc0" font-size="16">packets not delivered</text><path d="M110 500 C250 440 320 550 450 485 S700 445 820 500 S1000 450 1100 495" fill="none" stroke="#39d8ff" stroke-width="4"/></g></svg>