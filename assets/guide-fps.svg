<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0b1020"/><text x="80" y="90" fill="#fff" font-family="Arial" font-size="34" font-weight="700">FPS ≠ the whole story</text><text x="80" y="125" fill="#8fa0b8" font-family="Arial" font-size="17">Look at frame time and the bottleneck.</text><path d="M80 490H1120M80 200V490" stroke="#34445e" stroke-width="2"/><path d="M90 450 L170 430 L250 440 L330 420 L410 435 L490 415 L570 430 L650 425 L730 438 L810 420 L890 432 L970 418 L1050 430 L1120 425" fill="none" stroke="#39d8ff" stroke-width="5"/><path d="M90 450 L170 450 L250 450 L330 448 L410 452 L490 445 L570 450 L650 449 L730 451 L810 447 L890 450 L970 448 L1050 451 L1120 450" fill="none" stroke="#7a8da8" stroke-width="3"/><text x="85" y="530" fill="#39d8ff" font-family="Arial" font-size="16">stable frametime</text><text x="270" y="530" fill="#7a8da8" font-family="Arial" font-size="16">average FPS alone</text><rect x="830" y="210" width="270" height="180" rx="18" fill="#182237" stroke="#ffb84d"/><text x="860" y="250" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Bottleneck check</text><text x="860" y="290" fill="#aab8cb" font-family="Arial" font-size="16">GPU high → GPU limit</text><text x="860" y="322" fill="#aab8cb" font-family="Arial" font-size="16">GPU drops → CPU/software</text><text x="860" y="354" fill="#aab8cb" font-family="Arial" font-size="16">Spikes → investigate frame time</text></svg>