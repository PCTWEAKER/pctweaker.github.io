<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0b1020"/><text x="80" y="90" fill="#fff" font-family="Arial" font-size="34" font-weight="700">CS2 performance workflow</text><text x="80" y="125" fill="#8fa0b8" font-family="Arial" font-size="17">Stable frame delivery beats random launch-option lists.</text><g font-family="Arial"><circle cx="160" cy="315" r="70" fill="#172239" stroke="#39d8ff" stroke-width="3"/><text x="130" y="308" fill="#fff" font-size="19" font-weight="700">BASELINE</text><text x="135" y="335" fill="#9eacc0" font-size="14">FPS + frametime</text><circle cx="410" cy="315" r="70" fill="#172239" stroke="#39d8ff" stroke-width="3"/><text x="380" y="308" fill="#fff" font-size="19" font-weight="700">VIDEO</text><text x="375" y="335" fill="#9eacc0" font-size="14">low latency</text><circle cx="660" cy="315" r="70" fill="#172239" stroke="#39d8ff" stroke-width="3"/><text x="630" y="308" fill="#fff" font-size="19" font-weight="700">INPUT</text><text x="620" y="335" fill="#9eacc0" font-size="14">mouse / cap</text><circle cx="910" cy="315" r="70" fill="#172239" stroke="#39d8ff" stroke-width="3"/><text x="875" y="308" fill="#fff" font-size="19" font-weight="700">VERIFY</text><text x="865" y="335" fill="#9eacc0" font-size="14">same scenario</text><path d="M230 315H340M480 315H590M730 315H840" stroke="#39d8ff" stroke-width="5"/><text x="80" y="500" fill="#65758d" font-size="15">Steam system requirements and game updates can change. Keep launch options minimal and explainable.</text></g></svg>