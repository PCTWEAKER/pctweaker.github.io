<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0b1020"/><text x="80" y="90" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Driver testing</text><text x="80" y="125" fill="#8fa0b8" font-family="Arial" font-size="17">Record the version. Change one variable. Compare.</text><rect x="100" y="205" width="1000" height="85" rx="16" fill="#172239"/><text x="135" y="258" fill="#fff" font-family="Arial" font-size="21">Current driver</text><text x="420" y="258" fill="#39d8ff" font-family="Arial" font-size="21" font-weight="700">Version 5xx.xx</text><rect x="100" y="330" width="450" height="160" rx="18" fill="#172239"/><text x="135" y="375" fill="#aab8cb" font-family="Arial" font-size="16">TEST A</text><text x="135" y="420" fill="#fff" font-family="Arial" font-size="23" font-weight="700">FPS / frametime / stability</text><rect x="650" y="330" width="450" height="160" rx="18" fill="#172239"/><text x="685" y="375" fill="#aab8cb" font-family="Arial" font-size="16">TEST B</text><text x="685" y="420" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Same scene / new driver</text><path d="M550 410H650" stroke="#39d8ff" stroke-width="5"/><text x="80" y="550" fill="#65758d" font-family="Arial" font-size="14">Use official NVIDIA / AMD / Intel sources. Avoid unknown driver packages.</text></svg>