<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0b1020"/><text x="80" y="90" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Warzone stability checklist</text><text x="80" y="125" fill="#8fa0b8" font-family="Arial" font-size="17">Let shaders finish before judging performance.</text><rect x="90" y="200" width="1020" height="80" rx="16" fill="#172239"/><text x="125" y="250" fill="#fff" font-family="Arial" font-size="21">1  Requirements → Windows / TPM / Secure Boot / SSD</text><rect x="90" y="305" width="1020" height="80" rx="16" fill="#172239"/><text x="125" y="355" fill="#fff" font-family="Arial" font-size="21">2  Shader preloading → stay in the main menu until complete</text><rect x="90" y="410" width="1020" height="80" rx="16" fill="#172239"/><text x="125" y="460" fill="#fff" font-family="Arial" font-size="21">3  Driver + background apps → test one change at a time</text><circle cx="1035" cy="240" r="13" fill="#39d8ff"/><circle cx="1035" cy="345" r="13" fill="#39d8ff"/><circle cx="1035" cy="450" r="13" fill="#39d8ff"/></svg>